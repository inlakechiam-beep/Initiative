<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>D&D Initiative & HP Tracker</title>
  <style>
    :root {
      /* 60% Dominant Neutral */
      --bg-dominant: #0b0f19;
      
      /* 30% Secondary Structure & Containers */
      --bg-card: #151c2c;
      --bg-card-active: #1c263b;
      --bg-input: #0f172a;
      --border-subtle: #27354a;
      --border-focus: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      /* 10% Accents - Reserved for focal points */
      --accent-gold: #f59e0b;
      --accent-gold-glow: rgba(245, 158, 11, 0.25);
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      
      /* Dynamic token square sizing variable */
      --square-size: 110px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dominant);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 1200px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 10px;
      z-index: 100;
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .header-title span.icon {
      color: var(--accent-gold);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover {
      background: #2b3548;
      border-color: #3b82f6;
    }

    button:active {
      transform: scale(0.97);
    }

    button.btn-primary { 
      background: var(--accent-blue); 
      border-color: var(--accent-blue);
      color: #ffffff;
    }
    button.btn-primary:hover {
      background: #2563eb;
    }

    button.btn-danger-subtle {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    button.btn-danger-subtle:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: var(--accent-red);
      color: #ffffff;
    }

    .size-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-right: 6px;
      background: var(--bg-input);
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .size-picker input {
      width: 70px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    #tracker-list {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 50px;
    }

    .combatant-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      position: relative;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }

    .combatant-card:hover {
      border-color: #334155;
    }

    /* 10% Accent on Active Turn Card */
    .combatant-card.is-active {
      border-color: var(--accent-gold);
      background: var(--bg-card-active);
      box-shadow: 0 0 20px var(--accent-gold-glow);
    }

    .combatant-card.is-active::before {
      content: 'AM ZUG';
      position: absolute;
      top: -10px;
      right: 24px;
      background: var(--accent-gold);
      color: #0b0f19;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    /* 1. Initiative Badge */
    .init-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 6px;
      min-width: 58px;
    }

    .init-badge label {
      font-size: 0.62rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 0.5px;
    }

    .init-badge input {
      width: 44px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.25rem;
      font-weight: bold;
      text-align: center;
    }

    /* 2. Character Square & Name Container */
    .character-square-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      user-select: none;
      border-right: 1px solid var(--border-subtle);
      padding-right: 16px;
    }

    .character-square {
      width: var(--square-size);
      height: var(--square-size);
      background: var(--bg-input);
      border: 1px dashed var(--border-subtle);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: width 0.2s, height 0.2s, border-color 0.2s;
    }

    .character-square:hover {
      border-color: var(--accent-gold);
    }

    .character-square img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-hint {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.75);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 0.7rem;
      opacity: 0;
      transition: opacity 0.2s;
      text-align: center;
      padding: 4px;
    }

    .character-square:hover .upload-hint,
    .character-square.empty .upload-hint {
      opacity: 1;
    }

    .character-square input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .name-input {
      width: var(--square-size);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-main);
      font-weight: 700;
      text-align: center;
      font-size: 0.9rem;
      padding: 2px;
      transition: border-color 0.2s;
    }

    .name-input:focus {
      outline: none;
      border-bottom-color: var(--accent-gold);
    }

    /* 3. HP Calculator Section - Compact Fixed Width */
    .hp-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 250px;
      max-width: 250px;
      flex-shrink: 0;
      border-right: 1px solid var(--border-subtle);
      padding-right: 16px;
    }

    .hp-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .hp-display {
      font-size: 1.05rem;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hp-number-input {
      width: 50px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--accent-green);
      padding: 4px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .max-hp-input {
      width: 50px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 4px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .btn-full-hp {
      padding: 4px 8px;
      font-size: 0.7rem;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-full-hp:hover {
      background: var(--accent-gold);
      color: #0b0f19;
      border-color: var(--accent-gold);
    }

    .temp-hp-display {
      font-size: 0.8rem;
      color: var(--accent-purple);
      font-weight: 700;
    }

    .hp-inputs {
      display: flex;
      gap: 5px;
    }

    .hp-inputs input[type="number"] {
      width: 54px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 5px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.88rem;
    }

    .hp-buttons {
      display: flex;
      gap: 4px;
    }

    .hp-buttons button {
      padding: 5px 8px;
      font-size: 0.72rem;
      border: 1px solid transparent;
    }

    .btn-dmg {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-dmg:hover {
      background: var(--accent-red);
      color: #fff;
    }

    .btn-heal {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.3);
    }
    .btn-heal:hover {
      background: var(--accent-green);
      color: #fff;
    }

    .btn-temp {
      background: rgba(168, 85, 247, 0.15);
      color: #d8b4fe;
      border-color: rgba(168, 85, 247, 0.3);
    }
    .btn-temp:hover {
      background: var(--accent-purple);
      color: #fff;
    }

    /* Individual History Box Header & Log Container */
    .history-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-header {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .history-box {
      background: var(--bg-input);
      border-radius: 6px;
      padding: 5px 8px;
      height: 46px;
      max-height: 46px;
      overflow-y: auto;
      font-size: 0.72rem;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    .history-entry {
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .history-entry.dmg { color: #fca5a5; }
    .history-entry.heal { color: #86efac; }
    .history-entry.temp { color: #d8b4fe; }
    .history-entry.empty { color: #475569; font-style: italic; }

    /* 4. German Conditions Section - Flexible Layout */
    .conditions-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-right: 1px solid var(--border-subtle);
      padding-right: 16px;
      min-width: 260px;
    }

    .conditions-header {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .conditions-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-content: flex-start;
    }

    /* Inactive: Subtle Dark Neutral Pills (Prevents Rainbow Clutter) */
    .condition-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: #94a3b8;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
    }

    .condition-btn:hover {
      background: #1e293b;
      color: var(--text-main);
      border-color: #475569;
    }

    /* Active: Vibrant Accent Highlight with Glow */
    .condition-btn.active {
      background: var(--cond-color);
      color: var(--cond-text, #ffffff);
      border-color: var(--cond-color);
      font-weight: 700;
      box-shadow: 0 0 10px var(--cond-color), inset 0 0 2px rgba(255, 255, 255, 0.3);
      transform: scale(1.02);
    }

    /* 5. Delete Action */
    .card-actions button {
      padding: 6px 10px;
      font-size: 0.9rem;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
    }

    .card-actions button:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.88rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive layout adjustments */
    @media (max-width: 850px) {
      .combatant-card {
        flex-wrap: wrap;
      }
      .character-square-container {
        border-right: none;
        padding-right: 0;
      }
      .hp-section {
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
        padding-right: 0;
        padding-bottom: 12px;
        width: 100%;
        max-width: 100%;
      }
      .conditions-section {
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
        padding-right: 0;
        padding-bottom: 12px;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <span class="icon">⚔️</span> Initiative & HP Tracker
    </div>

    <div class="header-controls">
      <div class="size-picker">
        <label for="square-slider">Token:</label>
        <input type="range" id="square-slider" min="70" max="150" value="110" oninput="adjustSquareSize(this.value)" />
      </div>

      <button onclick="addCombatant()" class="btn-primary">+ Kreatur</button>
      <button onclick="resetAllLogs()" title="Logs für alle Kreaturen leeren">📜 Alle Logs zurücksetzen</button>
      <button onclick="resetTracker()" class="btn-danger-subtle">Alle Löschen</button>
    </div>
  </header>

  <div id="tracker-list">
    <!-- Dynamic Cards Rendered Here -->
  </div>

  <div id="toast">Aktion ausgeführt</div>

  <script>
    // 15 German D&D conditions with custom vibrant colors on selection
    const CONDITIONS = [
      { id: 'betaeubt', name: 'Betäubt', color: '#f59e0b', textOnActive: '#000000' },
      { id: 'bewusstlos', name: 'Bewusstlos', color: '#64748b', textOnActive: '#ffffff' },
      { id: 'bezaubert', name: 'Bezaubert', color: '#ec4899', textOnActive: '#ffffff' },
      { id: 'blind', name: 'Blind', color: '#3b82f6', textOnActive: '#ffffff' },
      { id: 'erschoepft', name: 'Erschöpft', color: '#d97706', textOnActive: '#ffffff' },
      { id: 'festgesetzt', name: 'Festgesetzt', color: '#8b5cf6', textOnActive: '#ffffff' },
      { id: 'gelaehmt', name: 'Gelähmt', color: '#ef4444', textOnActive: '#ffffff' },
      { id: 'gepackt', name: 'Gepackt', color: '#14b8a6', textOnActive: '#000000' },
      { id: 'kampfunfaehig', name: 'Kampfunfähig', color: '#dc2626', textOnActive: '#ffffff' },
      { id: 'liegend', name: 'Liegend', color: '#a855f7', textOnActive: '#ffffff' },
      { id: 'taub', name: 'Taub', color: '#6366f1', textOnActive: '#ffffff' },
      { id: 'unsichtbar', name: 'Unsichtbar', color: '#06b6d4', textOnActive: '#ffffff' },
      { id: 'veraengstigt', name: 'Verängstigt', color: '#10b981', textOnActive: '#ffffff' },
      { id: 'vergiftet', name: 'Vergiftet', color: '#22c55e', textOnActive: '#ffffff' },
      { id: 'versteinert', name: 'Versteinert', color: '#78716c', textOnActive: '#ffffff' }
    ];

    let activeId = null;
    let combatants = [];

    function saveToStorage() {
      try {
        localStorage.setItem('dnd_tracker_combatants', JSON.stringify(combatants));
        localStorage.setItem('dnd_tracker_activeId', activeId || '');
      } catch (e) {
        console.warn('LocalStorage limit or error:', e);
      }
    }

    function loadFromStorage() {
      const savedData = localStorage.getItem('dnd_tracker_combatants');
      const savedActive = localStorage.getItem('dnd_tracker_activeId');
      if (savedData) {
        combatants = JSON.parse(savedData);
        combatants.forEach(c => {
          if (!Array.isArray(c.conditions)) c.conditions = [];
          if (!Array.isArray(c.history)) c.history = [];
        });
        activeId = savedActive || (combatants.length > 0 ? combatants[0].id : null);
        return true;
      }
      return false;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    window.onload = () => {
      const hasSavedData = loadFromStorage();
      if (!hasSavedData) {
        addCombatant('Held Paladin', 20, 50, 'https://picsum.photos/seed/paladin/200');
        addCombatant('Goblin Anführer', 14, 18, 'https://picsum.photos/seed/goblin/200');
        addCombatant('Magier', 8, 22, 'https://picsum.photos/seed/wizard/200');
      } else {
        render();
      }
    };

    function adjustSquareSize(val) {
      document.documentElement.style.setProperty('--square-size', `${val}px`);
    }

    function sortCombatants() {
      combatants.sort((a, b) => b.init - a.init);
    }

    function addCombatant(name = 'Neue Kreatur', init = 10, maxHp = 30, imgUrl = '') {
      const id = Date.now() + Math.random().toString(36).substr(2, 4);
      const hp = Number(maxHp);
      combatants.push({
        id,
        name,
        init: Number(init),
        hp,
        maxHp: hp,
        tempHp: 0,
        img: imgUrl,
        conditions: [],
        history: [`Erstellt mit ${hp} HP`]
      });
      sortCombatants();
      if (!activeId) activeId = id;
      saveToStorage();
      render();
    }

    function removeCombatant(id, e) {
      if (e) e.stopPropagation();
      combatants = combatants.filter(c => c.id !== id);
      if (activeId === id) {
        activeId = combatants.length > 0 ? combatants[0].id : null;
      }
      saveToStorage();
      render();
    }

    function setActive(id) {
      activeId = id;
      saveToStorage();
      render();
    }

    function handleMaxHpInput(id, val) {
      const c = combatants.find(x => x.id === id);
      if (c) {
        const newMax = Math.max(0, parseInt(val) || 0);
        c.maxHp = newMax;
        c.hp = newMax; // Sync max HP to current HP instantly

        const currInput = document.getElementById(`curr-hp-${id}`);
        if (currInput) currInput.value = newMax;
        saveToStorage();
      }
    }

    function handleCurrentHpInput(id, val) {
      const c = combatants.find(x => x.id === id);
      if (c) {
        c.hp = Math.max(0, parseInt(val) || 0);
        saveToStorage();
      }
    }

    function handleInitInput(id, val) {
      const c = combatants.find(x => x.id === id);
      if (c) {
        c.init = parseInt(val) || 0;
        saveToStorage();
      }
    }

    function finalizeInitChange() {
      sortCombatants();
      saveToStorage();
      render();
    }

    function resetToFullHp(id) {
      const c = combatants.find(x => x.id === id);
      if (c) {
        c.hp = c.maxHp;
        c.history.unshift(`Vollständig geheilt (${c.maxHp} HP)`);
        saveToStorage();
        render();
      }
    }

    function applyDamage(id) {
      const c = combatants.find(x => x.id === id);
      const valInput = document.getElementById(`val-${id}`);
      let amount = parseInt(valInput.value) || 0;
      if (amount <= 0) return;

      let dmgRemaining = amount;
      let tempAbsorbed = 0;

      if (c.tempHp > 0) {
        if (c.tempHp >= dmgRemaining) {
          c.tempHp -= dmgRemaining;
          tempAbsorbed = dmgRemaining;
          dmgRemaining = 0;
        } else {
          tempAbsorbed = c.tempHp;
          dmgRemaining -= c.tempHp;
          c.tempHp = 0;
        }
      }

      c.hp -= dmgRemaining;
      if (c.hp < 0) c.hp = 0;

      let logMsg = `-${amount} Schdn`;
      if (tempAbsorbed > 0) logMsg += ` (${tempAbsorbed} Temp HP)`;
      c.history.unshift(logMsg);

      valInput.value = '';
      saveToStorage();
      render();
    }

    function applyHeal(id) {
      const c = combatants.find(x => x.id === id);
      const valInput = document.getElementById(`val-${id}`);
      let amount = parseInt(valInput.value) || 0;
      if (amount <= 0) return;

      c.hp += amount;
      if (c.hp > c.maxHp) c.hp = c.maxHp;

      c.history.unshift(`+${amount} Heilung`);
      valInput.value = '';
      saveToStorage();
      render();
    }

    function addTempHp(id) {
      const c = combatants.find(x => x.id === id);
      const valInput = document.getElementById(`val-${id}`);
      let amount = parseInt(valInput.value) || 0;
      if (amount <= 0) return;

      c.tempHp = amount;
      c.history.unshift(`+${amount} Temp HP`);
      valInput.value = '';
      saveToStorage();
      render();
    }

    function toggleCondition(combatantId, conditionId) {
      const c = combatants.find(x => x.id === combatantId);
      if (!c) return;
      if (!Array.isArray(c.conditions)) c.conditions = [];

      const index = c.conditions.indexOf(conditionId);
      if (index > -1) {
        c.conditions.splice(index, 1);
      } else {
        c.conditions.push(conditionId);
      }

      saveToStorage();

      const btn = document.getElementById(`cond-${combatantId}-${conditionId}`);
      if (btn) {
        if (c.conditions.includes(conditionId)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }
    }

    // Global Log Clear
    function resetAllLogs() {
      if (combatants.length === 0) return;
      combatants.forEach(c => {
        c.history = [];
      });
      saveToStorage();
      render();
      showToast("📜 Alle Logs wurden zurückgesetzt!");
    }

    function handleImageUpload(id, input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const c = combatants.find(x => x.id === id);
          c.img = e.target.result;
          saveToStorage();
          render();
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function updateName(id, newName) {
      const c = combatants.find(x => x.id === id);
      if (c) {
        c.name = newName;
        saveToStorage();
      }
    }

    function resetTracker() {
      combatants = [];
      activeId = null;
      localStorage.removeItem('dnd_tracker_combatants');
      localStorage.removeItem('dnd_tracker_activeId');
      render();
      showToast("Alle Kreaturen gelöscht!");
    }

    function render() {
      const listEl = document.getElementById('tracker-list');
      listEl.innerHTML = '';

      combatants.forEach((c) => {
        const isActive = c.id === activeId;

        const card = document.createElement('div');
        card.className = `combatant-card ${isActive ? 'is-active' : ''}`;
        card.onclick = () => setActive(c.id);

        const conditionsHtml = CONDITIONS.map(cond => {
          const isCondActive = Array.isArray(c.conditions) && c.conditions.includes(cond.id);
          return `
            <button 
              id="cond-${c.id}-${cond.id}"
              class="condition-btn ${isCondActive ? 'active' : ''}" 
              style="--cond-color: ${cond.color}; --cond-text: ${cond.textOnActive};"
              onclick="event.stopPropagation(); toggleCondition('${c.id}', '${cond.id}')"
              title="${cond.name}"
            >
              ${cond.name}
            </button>
          `;
        }).join('');

        card.innerHTML = `
          <!-- 1. INITIATIVE INPUT -->
          <div class="init-badge" onclick="event.stopPropagation()">
            <label>INIT</label>
            <input type="number" value="${c.init}" oninput="handleInitInput('${c.id}', this.value)" onchange="finalizeInitChange()" />
          </div>

          <!-- 2. TOKEN IMAGE & NAME -->
          <div class="character-square-container" onclick="event.stopPropagation()">
            <div class="character-square ${!c.img ? 'empty' : ''}">
              ${c.img ? `<img src="${c.img}" alt="Token" />` : `<span style="font-size:1.8rem; color:var(--text-muted);">👤</span>`}
              <div class="upload-hint">📷 Ändern</div>
              <input type="file" accept="image/*" onchange="handleImageUpload('${c.id}', this)" onclick="event.stopPropagation()" />
            </div>
            <input type="text" class="name-input" value="${c.name}" oninput="updateName('${c.id}', this.value)" onclick="event.stopPropagation()" />
          </div>

          <!-- 3. HP & CALCULATOR SECTION -->
          <div class="hp-section" onclick="event.stopPropagation()">
            <div class="hp-stats">
              <span class="hp-display">
                ❤️ 
                <input type="number" id="curr-hp-${c.id}" class="hp-number-input" value="${c.hp}" title="Aktuelle HP" oninput="handleCurrentHpInput('${c.id}', this.value)" />
                /
                <input type="number" id="max-hp-${c.id}" class="max-hp-input" value="${c.maxHp}" title="Maximale HP" oninput="handleMaxHpInput('${c.id}', this.value)" />
              </span>
              <button class="btn-full-hp" onclick="resetToFullHp('${c.id}')" title="HP auf Max zurücksetzen">Full</button>
              ${c.tempHp > 0 ? `<span class="temp-hp-display">🛡️ +${c.tempHp}</span>` : ''}
            </div>

            <div class="hp-inputs">
              <input type="number" id="val-${c.id}" placeholder="Wert" min="1" />
              <div class="hp-buttons">
                <button onclick="applyDamage('${c.id}')" class="btn-dmg">- Dmg</button>
                <button onclick="applyHeal('${c.id}')" class="btn-heal">+ Heal</button>
                <button onclick="addTempHp('${c.id}')" class="btn-temp">+ Temp</button>
              </div>
            </div>

            <div class="history-container">
              <div class="history-header">VERLAUF</div>
              <div class="history-box">
                ${c.history && c.history.length > 0 
                  ? c.history.map(h => {
                      let classType = h.includes('Schdn') ? 'dmg' : h.includes('Heilung') || h.includes('Vollständig') ? 'heal' : 'temp';
                      return `<div class="history-entry ${classType}">${h}</div>`;
                    }).join('')
                  : `<div class="history-entry empty">Keine Einträge</div>`
                }
              </div>
            </div>
          </div>

          <!-- 4. GERMAN CONDITIONS SECTION -->
          <div class="conditions-section" onclick="event.stopPropagation()">
            <div class="conditions-header">Zustände</div>
            <div class="conditions-grid">
              ${conditionsHtml}
            </div>
          </div>

          <!-- 5. DELETE BUTTON -->
          <div class="card-actions">
            <button onclick="removeCombatant('${c.id}', event)" title="Kreatur Entfernen">✕</button>
          </div>
        `;

        listEl.appendChild(card);
      });
    }
  </script>
</body>
</html>
